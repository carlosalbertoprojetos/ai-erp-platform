[project]
name = "coreflow-agents"
version = "0.1.0"
description = "Production-grade AI multi-agent software engineering orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.0",
    "openai>=1.99.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]
observability = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=agents --cov=apps --cov=application --cov=domain --cov=infrastructure --cov=shared --cov-fail-under=85 -q"

[tool.coverage.run]
omit = [
    "tests/*",
    "generated/*",
]
